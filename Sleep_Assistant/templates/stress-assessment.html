{% load static %}
<!doctype html>
<html class="no-js" lang="zh-CN">
<head>
    <meta charset="utf-8">
    <meta http-equiv="x-ua-compatible" content="ie=edge">
    <title>压力水平评估 - 睡眠管理系统</title>
    <meta name="description" content="专业的压力水平评估系统">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <link rel="shortcut icon" type="image/x-icon" href="{% static 'img/favicon.png' %}">

    <!-- CSS here -->
    <link rel="stylesheet" href="{% static 'css/bootstrap.min.css' %}">
    <link rel="stylesheet" href="{% static 'css/fontawesome-all.min.css' %}">
    <link rel="stylesheet" href="{% static 'css/animate.css' %}">
    <link rel="stylesheet" href="{% static 'css/style.css' %}">
    <link rel="stylesheet" href="{% static 'css/responsive.css' %}">
    <style>
        .stress-assessment {
            background: linear-gradient(135deg, #f5f7fa 0%, #c3cfe2 100%);
            min-height: 100vh;
            padding: 40px 0;
        }
        .assessment-card {
            background: white;
            border-radius: 15px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.1);
            padding: 30px;
            margin-bottom: 30px;
        }
        .stress-meter {
            height: 20px;
            background: linear-gradient(to right, #4CAF50, #FFC107, #F44336);
            border-radius: 10px;
            margin: 20px 0;
            position: relative;
        }
        .stress-indicator {
            position: absolute;
            width: 20px;
            height: 30px;
            background: #333;
            top: -5px;
            transform: translateX(-50%);
            transition: left 0.5s ease;
        }
        .advice-card {
            background: #f8f9fa;
            border-radius: 10px;
            padding: 20px;
            margin-top: 20px;
            display: none;
        }
        .form-control:focus {
            box-shadow: 0 0 0 0.25rem rgba(13,110,253,0.25);
        }
    </style>
</head>
<body class="stress-assessment">

    <div class="container">
        <div class="row justify-content-center">
            <div class="col-lg-8">
                <div class="assessment-card">
                    <div class="text-center mb-4">
                        <h2 class="mb-3">压力水平评估</h2>
                        <p class="lead">填写以下信息评估您的压力水平</p>
                    </div>
                    
                    <form id="stressForm">
                        <div class="row">
                            <div class="col-md-6">
                                <div class="mb-3">
                                    <label for="age" class="form-label">年龄</label>
                                    <input type="number" class="form-control" id="age" min="18" max="100" required>
                                </div>
                                <div class="mb-3">
                                    <label for="sleepDuration" class="form-label">睡眠时长(小时)</label>
                                    <input type="number" step="0.1" class="form-control" id="sleepDuration" min="0" max="24" required>
                                </div>
                                <div class="mb-3">
                                    <label for="activityLevel" class="form-label">日均体力劳动时间(分钟)</label>
                                    <input type="number" class="form-control" id="activityLevel" min="1" max="600" required>
                                </div>
                                <div class="mb-3">
                                    <label for="heartRate" class="form-label">心率(bpm)</label>
                                    <input type="number" class="form-control" id="heartRate" min="40" max="200" required>
                                </div>
                                <div class="mb-3">
                                    <label for="dailySteps" class="form-label">每日步数</label>
                                    <input type="number" class="form-control" id="dailySteps" min="0" required>
                                </div>
                            </div>
                            <div class="col-md-6">
                                <div class="mb-3">
                                    <label class="form-label">性别</label>
                                    <select class="form-select" id="gender">
                                        <option value="female">女性</option>
                                        <option value="male">男性</option>
                                    </select>
                                </div>
                                <div class="mb-3">
                                    <label class="form-label">职业</label>
                                    <select class="form-select" id="occupation">
                                        <option value="other">其他</option>
                                        <option value="accountant">会计</option>
                                        <option value="doctor">医生</option>
                                        <option value="engineer">工程师</option>
                                        <option value="lawyer">律师</option>
                                        <option value="manager">经理</option>
                                        <option value="nurse">护士</option>
                                        <option value="sales_rep">销售代表</option>
                                        <option value="salesperson">销售人员</option>
                                        <option value="scientist">科学家</option>
                                        <option value="software_engineer">软件工程师</option>
                                        <option value="teacher">教师</option>
                                    </select>
                                </div>
                                <div class="mb-3">
                                    <label class="form-label">BMI分类</label>
                                    <select class="form-select" id="bmiCategory">
                                        <option value="normal">正常</option>
                                        <option value="overweight">超重</option>
                                        <option value="obese">肥胖</option>
                                    </select>
                                </div>
                                <div class="mb-3">
                                    <label class="form-label">睡眠障碍</label>
                                    <select class="form-select" id="sleepDisorder">
                                        <option value="none">无</option>
                                        <option value="insomnia">失眠</option>
                                        <option value="sleep_apnea">睡眠呼吸暂停</option>
                                    </select>
                                </div>
                            </div>
                        </div>
                        
                        <div class="text-center mt-4">
                            <button type="submit" class="btn btn-primary btn-lg px-5">
                                <i class="fas fa-chart-line me-2"></i>评估压力水平
                            </button>
                        </div>
                    </form>
                    
                    <div id="resultContainer" class="mt-5 text-center" style="display:none;">
                        <h4 class="mb-4">您的压力水平评估结果：</h4>
                        <div id="stressResult" class="display-4 mb-3"></div>
                        
                        <div class="stress-meter">
                            <div id="stressIndicator" class="stress-indicator"></div>
                        </div>
                        
                        <div id="adviceContainer" class="advice-card">
                            <h5 class="mb-3"><i class="fas fa-lightbulb me-2"></i>建议</h5>
                            <div id="stressAdvice"></div>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <!-- JS here -->
    <script src="{% static 'js/jquery.min.js' %}"></script>
    <script src="{% static 'js/popper.min.js' %}"></script>
    <script src="{% static 'js/bootstrap.min.js' %}"></script>
    <script src="{% static 'js/stress-assessment.js' %}"></script>
</body>
</html>
