{% load static %}
<!doctype html>
<html class="no-js" lang="zh-CN">
<head>
    <meta charset="utf-8">
    <meta http-equiv="x-ua-compatible" content="ie=edge">
    <title>压力水平评估 - 睡眠管理系统</title>
    <meta name="description" content="专业的压力水平评估系统">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <link rel="shortcut icon" type="image/x-icon" href="{% static 'img/favicon.png' %}">

    <!-- CSS here -->
    <link rel="stylesheet" href="{% static 'css/bootstrap.min.css' %}">
    <link rel="stylesheet" href="{% static 'css/fontawesome-all.min.css' %}">
    <link rel="stylesheet" href="{% static 'flat-icon/flaticon.css' %}">
    <link rel="stylesheet" href="{% static 'css/meanmenu.css' %}">
    <link rel="stylesheet" href="{% static 'css/slick.css' %}">
    <link rel="stylesheet" href="{% static 'css/aos.css' %}">
    <link rel="stylesheet" href="{% static 'css/animate.css' %}">
    <link rel="stylesheet" href="{% static 'css/magnific-popup.css' %}">
    <link rel="stylesheet" href="{% static 'css/default.css' %}">
    <link rel="stylesheet" href="{% static 'css/style.css' %}">
    <link rel="stylesheet" href="{% static 'css/responsive.css' %}">
</head>
<body>
    <!-- preloader -->
    <div id="loading">
        <div id="loading-center">
            <div id="loading-center-absolute">
                <div class="object" id="object_one"></div>
                <div class="object" id="object_two"></div>
                <div class="object" id="object_three"></div>
                <div class="object" id="object_four"></div>
            </div>
        </div>
    </div>
    <!-- preloader end -->

    <!-- Header -->
    <header class="header-transfrent">
        <div class="header-area">
            <div class="container">
                <div class="row align-items-center">
                    <div class="col-xl-1 col-lg-1">
                        <div class="logo-area">
                            <a href="{% url 'home' %}"><img src="{% static 'img/logo.png' %}" alt=""></a>
                        </div>
                    </div>
                    <div class="col-xl-8 col-lg-8">
                        <div class="main-menu">
                            <nav id="mobile-menu">
                                <ul>
                                    <li><a href="{% url 'home' %}">首页</a></li>
                                    <li><a href="{% url 'science' %}">知识中心</a></li>
                                    <li><a href="{% url 'tracker' %}">睡眠记录</a></li>
                                    <li><a href="{% url 'assessment' %}">睡眠评分</a></li>
                                    <li><a href="{% url 'advice' %}">睡眠助手</a></li>
                                    <li><a href="{% url 'community' %}">交流社区</a></li>
                                </ul>
                            </nav>
                        </div>
                        <div class="mobile-menu"></div>
                    </div>
                    <div class="col-xl-3 col-lg-3 d-none d-lg-block">
                        <div class="header-user-profile dropdown f-right">
                            <div class="user-avatar dropdown-toggle" data-bs-toggle="dropdown" aria-expanded="false">
                                <img src="{% static 'img/author-2.png' %}" alt="用户头像">
                            </div>
                            <ul class="dropdown-menu">
                                <li><a class="dropdown-item" href="#signinModal" data-bs-toggle="modal">登录</a></li>
                                <li><a class="dropdown-item" href="#signupModal" data-bs-toggle="modal">注册</a></li>
                                <li><hr class="dropdown-divider"></li>
                                <li><a class="dropdown-item" href="{% url 'profile' %}">用户中心</a></li>
                            </ul>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </header>

    <!-- Main Content -->
    <div class="container mt-100 mb-100">
        <div class="row">
            <div class="col-lg-8 offset-lg-2">
                <div class="section-title text-center">
                    <h2>压力水平评估</h2>
                    <p>填写以下信息评估您的压力水平</p>
                </div>
                <div class="contact-form">
                    <form id="stressForm">
                        <div class="row">
                            <div class="col-md-6">
                                <div class="form-group">
                                    <label for="age">年龄</label>
                                    <input type="number" class="form-control" id="age" min="18" max="100" required>
                                </div>
                                <div class="form-group">
                                    <label for="sleepDuration">睡眠时长(小时)</label>
                                    <input type="number" step="0.1" class="form-control" id="sleepDuration" min="0" max="24" required>
                                </div>
                                <div class="form-group">
                                    <label for="activityLevel">身体活动水平(1-100)</label>
                                    <input type="number" class="form-control" id="activityLevel" min="1" max="100" required>
                                </div>
                                <div class="form-group">
                                    <label for="heartRate">心率(bpm)</label>
                                    <input type="number" class="form-control" id="heartRate" min="40" max="200" required>
                                </div>
                                <div class="form-group">
                                    <label for="dailySteps">每日步数</label>
                                    <input type="number" class="form-control" id="dailySteps" min="0" required>
                                </div>
                            </div>
                            <div class="col-md-6">
                                <div class="form-group">
                                    <label>性别</label>
                                    <select class="form-control" id="gender">
                                        <option value="female">女性</option>
                                        <option value="male">男性</option>
                                    </select>
                                </div>
                                <div class="form-group">
                                    <label>职业</label>
                                    <select class="form-control" id="occupation">
                                        <option value="other">其他</option>
                                        <option value="accountant">会计</option>
                                        <option value="doctor">医生</option>
                                        <option value="engineer">工程师</option>
                                        <option value="lawyer">律师</option>
                                        <option value="manager">经理</option>
                                        <option value="nurse">护士</option>
                                        <option value="sales_rep">销售代表</option>
                                        <option value="salesperson">销售人员</option>
                                        <option value="scientist">科学家</option>
                                        <option value="software_engineer">软件工程师</option>
                                        <option value="teacher">教师</option>
                                    </select>
                                </div>
                                <div class="form-group">
                                    <label>BMI分类</label>
                                    <select class="form-control" id="bmiCategory">
                                        <option value="normal">正常</option>
                                        <option value="normal_weight">正常体重</option>
                                        <option value="overweight">超重</option>
                                        <option value="obese">肥胖</option>
                                    </select>
                                </div>
                                <div class="form-group">
                                    <label>睡眠障碍</label>
                                    <select class="form-control" id="sleepDisorder">
                                        <option value="none">无</option>
                                        <option value="insomnia">失眠</option>
                                        <option value="sleep_apnea">睡眠呼吸暂停</option>
                                    </select>
                                </div>
                            </div>
                        </div>
                        <div class="text-center">
                            <button type="submit" class="btn btn-primary">评估压力水平</button>
                        </div>
                    </form>
                    <div id="resultContainer" class="mt-4 text-center" style="display:none;">
                        <h4>您的压力水平评估结果：</h4>
                        <div id="stressResult" class="display-4"></div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <!-- JS here -->
    <script src="{% static 'js/jquery.min.js' %}"></script>
    <script src="{% static 'js/popper.min.js' %}"></script>
    <script src="{% static 'js/bootstrap.min.js' %}"></script>
    <script src="{% static 'js/jquery.meanmenu.js' %}"></script>
    <script src="{% static 'js/main.js' %}"></script>
    <script src="{% static 'js/stress-assessment.js' %}"></script>
</body>
</html>
