{% load static %}
<!doctype html>
<html class="no-js" lang="zh-CN">
<head>
    <meta charset="utf-8">
    <meta http-equiv="x-ua-compatible" content="ie=edge">
    <title>AI 伴眠助手 - 睡眠管理系统</title>
    <meta name="description" content="AI 伴眠助手，为您提供个性化的睡眠建议和陪伴">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <link rel="shortcut icon" type="image/x-icon" href="{% static 'img/favicon.png' %}">

    <!-- CSS here -->
    <link rel="stylesheet" href="{% static 'css/bootstrap.min.css' %}">
    <link rel="stylesheet" href="{% static 'css/fontawesome-all.min.css' %}">
    <link rel="stylesheet" href="{% static 'flat-icon/flaticon.css' %}">
    <link rel="stylesheet" href="{% static 'css/meanmenu.css' %}">
    <link rel="stylesheet" href="{% static 'css/slick.css' %}">
    <link rel="stylesheet" href="{% static 'css/aos.css' %}">
    <link rel="stylesheet" href="{% static 'css/animate.css' %}">
    <link rel="stylesheet" href="{% static 'css/magnific-popup.css' %}">
    <link rel="stylesheet" href="{% static 'css/default.css' %}">
    <link rel="stylesheet" href="{% static 'css/style.css' %}">
    <link rel="stylesheet" href="{% static 'css/responsive.css' %}">
    <link rel="stylesheet" href="{% static 'css/chat-assistant.css' %}">
    <link rel="stylesheet" href="{% static 'css/hearder-area.css' %}">
    <link rel="stylesheet" href="{% static 'css/login-register.css' %}">
</head>
<body>
    <!-- preloader -->
    <div id="loading">
        <div id="loading-center">
            <div id="loading-center-absolute">
                <div class="object" id="object_one"></div>
                <div class="object" id="object_two"></div>
                <div class="object" id="object_three"></div>
                <div class="object" id="object_four"></div>
            </div>
        </div>
    </div>
    <!-- preloader end -->

    <!-- ============= header-area-start ==================== -->
    <header class="header-transfrent">
        <div class="header-area">
            <div class="container">
                <div class="row align-items-center">
                    <div class="col-xl-1 col-lg-1">
                        <div class="logo-area">
                            <a href="{% url 'home' %}"><img src="{% static 'img/logo.png' %}" alt=""></a>
                        </div>
                    </div>
                    <div class="col-xl-8 col-lg-8">
                        <div class="main-menu">
                            <nav id="mobile-menu">
                                <ul>
                                    <li><a href="{% url 'home' %}">首页</a></li>
                                    <li><a href="{% url 'science' %}">知识中心</a></li>
                                    <li><a href="{% url 'tracker' %}">睡眠记录</a></li>
                                    <li><a href="{% url 'assessment' %}">睡眠评分</a></li>
                                    <li><a href="{% url 'advice' %}">睡眠助手</a></li>
                                    <li class="dropdown">
                                        <a href="{% url 'community' %}">交流社区 <i class="fas fa-chevron-down"></i></a>
                                        <ul class="dropdown-menu">
                                            <li><a href="#forum">论坛</a></li>
                                            <li><a href="#groups">群组</a></li>
                                            <li><a href="#qna">专家问答</a></li>
                                            <li><a href="#diary">睡眠日记</a></li>
                                            <li><a href="#challenges">挑战活动</a></li>
                                        </ul>
                                    </li>
                                </ul>
                            </nav>
                        </div>
                        <div class="mobile-menu"></div>
                    </div>
                            <div class="col-xl-3 col-lg-3 d-none d-lg-block">
                            <div class="header-user-profile f-right">
                                <div class="user-avatar">
                                    <img src="{% static 'img/author-1.png' %}" alt="用户头像">
                                </div>
                                <ul class="dropdown-menu">
                                    <li><a href="#signinModal" data-toggle="modal">登录</a></li>
                                    <li><a href="#signupModal" data-toggle="modal">注册</a></li>
                                    <li><a href="{% url 'profile' %}">用户中心</a></li>
                                </ul>
                            </div>
                    </div>
                </div>
            </div>
        </div>
    </header>
    <!-- ============= header-area-end ====================== -->
    <!-- ============== main-content-start ============== -->
    <div class="main-content">
        <div class="container">
            <div class="chat-header-actions">
                <h1>AI 伴眠助手</h1>
                <button id="themeToggle" class="theme-toggle">
                    <i class="fas fa-moon"></i>
                    <i class="fas fa-sun"></i>
                </button>
            </div>
            <div class="chat-container">
                <div class="chat-header">

                    <div class="role-selector">
                        <button class="role-btn" data-role="default">
                            <i class="fas fa-robot"></i>
                            <span>默认助手</span>
                        </button>
                        <button class="role-btn" data-role="sister">
                            <i class="fas fa-heart"></i>
                            <span>知心大姐姐</span>
                        </button>
                        <button class="role-btn" data-role="doctor">
                            <i class="fas fa-stethoscope"></i>
                            <span>睡眠医生</span>
                        </button>
                        <button class="role-btn" data-role="coach">
                            <i class="fas fa-running"></i>
                            <span>睡眠教练</span>
                        </button>
                    </div>
                    <button id="stopBtn" class="stop-btn">
                        <i class="fas fa-stop-circle"></i>
                        <span>停止响应</span>
                    </button>
                </div>
                <div id="chatBody" class="chat-body"></div>
                <div class="chat-input-area">
                    <input type="text" id="chatInput" placeholder="输入你的睡眠问题...">
                    <button id="sendBtn" class="send-btn">
                        <span>发送</span>
                        <i class="fas fa-paper-plane"></i>
                    </button>
                </div>
            </div>
        </div>
    </div>
    <!-- ============= main-content-end ================= -->
    <!-- 登录注册模态框 -->
    <div class="modal fade" id="signinModal" tabindex="-1" role="dialog" aria-hidden="true">
        <div class="modal-dialog modal-dialog-centered" role="document">
            <div class="modal-content">
                <div class="modal-header">
                    <h5 class="modal-title">登录系统</h5>
                    <button type="button" class="close" data-dismiss="modal" aria-label="Close">
                        <span aria-hidden="true">&times;</span>
                    </button>
                </div>
                <div class="modal-body">
                    <form id="loginForm">
                        <div class="form-group">
                            <label for="loginPhone">手机号</label>
                            <input type="text" class="form-control" id="loginPhone" placeholder="请输入手机号" required>
                        </div>
                        <div class="form-group">
                            <label for="loginPassword">密码</label>
                            <input type="password" class="form-control" id="loginPassword" placeholder="请输入密码" required>
                        </div>
                        <div class="form-group form-check">
                            <input type="checkbox" class="form-check-input" id="rememberMe">
                            <label class="form-check-label" for="rememberMe">记住我</label>
                            <a href="#" class="float-right">忘记密码?</a>
                        </div>
                        <button type="submit" class="btn btn-primary btn-block">登录</button>
                    </form>
                    <div class="text-center mt-3">
                        <p>还没有账号? <a href="#signupModal" data-bs-toggle="modal" data-dismiss="modal">立即注册</a></p>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <!-- 注册模态框 -->
    <div class="modal fade" id="signupModal" tabindex="-1" role="dialog" aria-hidden="true">
        <div class="modal-dialog modal-dialog-centered" role="document">
            <div class="modal-content">
                <div class="modal-header">
                    <h5 class="modal-title">用户注册</h5>
                    <button type="button" class="close" data-dismiss="modal" aria-label="Close">
                        <span aria-hidden="true">&times;</span>
                    </button>
                </div>
                <div class="modal-body">
                    <form id="registerForm">
                        {% csrf_token %}
                        <div class="form-group">
                            <label for="registerName">用户名</label>
                            <input type="text" class="form-control" id="registerName" placeholder="请输入用户名" required>
                        </div>
                        <div class="form-group">
                            <label for="registerPhone">手机号</label>
                            <input type="text" class="form-control" id="registerPhone" placeholder="请输入手机号" required>
                        </div>
                        <div class="form-group">
                            <label for="registerEmail">邮箱</label>
                            <input type="email" class="form-control" id="registerEmail" placeholder="请输入邮箱" required>
                        </div>
                        <div class="form-group">
                            <label for="registerPassword">密码</label>
                            <input type="password" class="form-control" id="registerPassword" placeholder="请输入密码(6-20位)" required>
                        </div>
                        <div class="form-group">
                            <label for="confirmPassword">确认密码</label>
                            <input type="password" class="form-control" id="confirmPassword" placeholder="请再次输入密码" required>
                        </div>
                        <div class="form-group">
                            <label for="verificationCode">验证码</label>
                            <div class="input-group">
                                <input type="text" class="form-control" id="verificationCode" placeholder="请输入验证码" required>
                                <div class="input-group-append">
                                    <button class="btn btn-outline-secondary" type="button" id="getCodeBtn">获取验证码</button>
                                </div>
                            </div>
                        </div>
                        <div class="form-group form-check">
                            <input type="checkbox" class="form-check-input" id="agreeTerms" required>
                            <label class="form-check-label" for="agreeTerms">我已阅读并同意<a href="#">用户协议</a></label>
                        </div>
                        <button type="submit" class="btn btn-primary btn-block">注册</button>
                    </form>
                    <div class="text-center mt-3">
                        <p>已有账号? <a href="#signinModal" data-bs-toggle="modal" data-dismiss="modal">立即登录</a></p>
                    </div>
                </div>
            </div>
        </div>
    </div>
    <!-- JS here -->
    <script src="{% static 'js/login-register.js' %}"></script>
    <script src="{% static 'js/jquery.min.js' %}"></script>
    <script src="{% static 'js/popper.min.js' %}"></script>
    <script src="{% static 'js/bootstrap.min.js' %}"></script>
    <script src="{% static 'js/jquery.meanmenu.js' %}"></script>
    <script src="{% static 'js/slick.min.js' %}"></script>
    <script src="{% static 'js/aos.js' %}"></script>
    <script src="{% static 'js/jquery.counterup.min.js' %}"></script>
    <script src="{% static 'js/isotope.pkgd.min.js' %}"></script>
    <script src="{% static 'js/wow.min.js' %}"></script>
    <script src="{% static 'js/jquery.magnific-popup.min.js' %}"></script>
    <script src="{% static 'js/waypoints.min.js' %}"></script>
    <script src="{% static 'js/plugins.js' %}"></script>
    <script src="{% static 'js/velocity.min.js' %}"></script>
    <script src="{% static 'js/velocity.ui.min.js' %}"></script>
    <script src="{% static 'js/main.js' %}"></script>
    <script src="{% static 'js/chat-assistant.js' %}"></script>
</body>
</html>
