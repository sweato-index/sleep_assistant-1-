{% load static %}
<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>话题讨论 - 睡眠助手</title>
    <link rel="stylesheet" href="{% static 'css/bootstrap.min.css' %}">
    <link rel="stylesheet" href="{% static 'css/community.css' %}">
    <link rel="stylesheet" href="{% static 'css/style.css' %}">
</head>
<body>
    <!-- 导航栏 -->
    <nav class="navbar navbar-expand-lg navbar-light bg-light">
        <div class="container">
            <a class="navbar-brand" href="{% url 'home' %}">
                <img src="{% static 'img/logo.png' %}" alt="Logo" height="40">
            </a>
            <button class="navbar-toggler" type="button" data-toggle="collapse" data-target="#navbarNav">
                <span class="navbar-toggler-icon"></span>
            </button>
            <div class="collapse navbar-collapse" id="navbarNav">
                <ul class="navbar-nav ml-auto">
                    <li class="nav-item">
                        <a class="nav-link" href="{% url 'community' %}">社区</a>
                    </li>
                </ul>
            </div>
        </div>
    </nav>

    <!-- 话题内容 -->
    <div class="container mt-5">
        <div class="row">
            <div class="col-md-8">
                <!-- 话题标题 -->
                <h1 class="topic-title mb-4" id="post-title"></h1>
                
                <!-- 话题内容 -->
                <div class="card mb-4" id="post-content">
                    <div class="card-body">
                        <div class="d-flex align-items-center mb-3">
                            <img src="{% if user.avatar_url %}/media/{{ user.avatar_url }}{% else %}{% static 'img/author-1.png' %}{% endif %}" alt="用户头像" class="rounded-circle mr-3" width="50" id="post-author-avatar">
                            <div>
                                <h5 class="mb-0" id="post-author-name"></h5>
                                <small class="text-muted" id="post-create-time"></small>
                            </div>
                        </div>
                        <p class="card-text" id="post-text"></p>
                        <div class="post-actions mt-3">
                            <button class="btn btn-sm btn-outline-primary" id="like-btn">
                                <i class="far fa-thumbs-up"></i> 点赞 (<span id="like-count">0</span>)
                            </button>
                            <button class="btn btn-sm btn-outline-secondary ml-2" id="favorite-btn">
                                <i class="far fa-star"></i> 收藏 (<span id="favorite-count">0</span>)
                            </button>
                        </div>
                    </div>
                </div>

                <!-- 评论区域 -->
                <div class="comments-section">
                    <h4 class="mb-4">评论</h4>
                    
                    <!-- 评论表单 -->
                    <form class="mb-5" id="comment-form">
                        <div class="form-group">
                            <textarea class="form-control" rows="3" placeholder="写下你的评论..." id="comment-text" required></textarea>
                        </div>
                        <button type="submit" class="btn btn-primary">提交评论</button>
                    </form>

                    <!-- 评论列表 -->
                    <div class="comment-list" id="comment-list">
                        <!-- 评论将通过JavaScript动态加载 -->
                    </div>
                </div>
            </div>

            <!-- 侧边栏 -->
            <div class="col-md-4">
                <div class="card">
                    <div class="card-body">
                        <h5 class="card-title">相关话题</h5>
                        <ul class="list-group list-group-flush">
                            <li class="list-group-item">
                                <a href="#">睡眠呼吸暂停</a>
                            </li>
                            <li class="list-group-item">
                                <a href="#">午睡的好处</a>
                            </li>
                            <li class="list-group-item">
                                <a href="#">如何提高睡眠质量</a>
                            </li>
                        </ul>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <!-- 页脚 -->
    <footer class="footer mt-5 py-4 bg-light">
        <div class="container">
            <p class="text-center">© 2025 睡眠助手. 保留所有权利。</p>
        </div>
    </footer>

    <script src="{% static 'js/jquery.min.js' %}"></script>
    <script src="{% static 'js/bootstrap.min.js' %}"></script>
    <script src="{% static 'js/forum-topic.js' %}"></script>
</body>
</html>
